<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FileIndexer</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.initColumnResize = function (tableSelector) {
            var table = document.querySelector(tableSelector);
            if (!table) return;
            var cols = table.querySelectorAll('th');
            cols.forEach(function (th) {
                if (th.querySelector('.col-resize-handle')) return;
                var handle = document.createElement('div');
                handle.className = 'col-resize-handle';
                th.appendChild(handle);
                var startX, startW, didDrag;
                handle.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                });
                handle.addEventListener('mousedown', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    startX = e.pageX;
                    startW = th.offsetWidth;
                    didDrag = false;
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                    var onMove = function (e2) {
                        didDrag = true;
                        var w = startW + (e2.pageX - startX);
                        if (w > 30) th.style.width = w + 'px';
                    };
                    var onUp = function () {
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
            });
        };
        window.themeInterop = {
            setTheme: function (theme) {
                var root = document.documentElement;
                root.classList.remove('light-theme', 'dark-theme');
                if (theme) root.classList.add(theme);
            },
            getSystemTheme: function () {
                return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
        };
    </script>
</body>
</html>
