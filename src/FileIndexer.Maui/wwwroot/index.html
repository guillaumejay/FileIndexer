<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FileIndexer</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/FileIndexer.UI/fileindexer.css" />
    <link rel="stylesheet" href="css/maui.css" />
    <script src="_content/FileIndexer.UI/fileindexer.js"></script>
    <script>fileIndexer.applyStoredTheme();</script>
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        <span id="blazor-error-msg">An unhandled error has occurred.</span>
        <a href="" class="reload">Reload</a>
        <a class="dismiss">Dismiss</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.addEventListener('error', function (e) {
            var msg = document.getElementById('blazor-error-msg');
            if (msg) msg.textContent = e.message + ' | ' + (e.filename || '') + ':' + (e.lineno || '');
        });
        window.addEventListener('unhandledrejection', function (e) {
            var msg = document.getElementById('blazor-error-msg');
            if (msg) msg.textContent = String(e.reason);
        });
    </script>
</body>
</html>
