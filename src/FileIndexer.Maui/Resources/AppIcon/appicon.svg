<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="file" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Stacked files (back) -->
  <rect x="148" y="88" width="200" height="260" rx="14" fill="#1e40af" opacity="0.4"/>
  <rect x="128" y="108" width="200" height="260" rx="14" fill="#1e40af" opacity="0.6"/>
  <!-- Main file -->
  <rect x="108" y="128" width="200" height="260" rx="14" fill="url(#file)"/>
  <!-- File lines -->
  <rect x="140" y="180" width="136" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="204" width="110" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="228" width="126" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="252" width="90" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="276" width="120" height="8" rx="4" fill="#94a3b8"/>
  <rect x="140" y="300" width="100" height="8" rx="4" fill="#94a3b8"/>
  <!-- Magnifying glass -->
  <circle cx="340" cy="320" r="68" fill="none" stroke="#ffffff" stroke-width="18"/>
  <circle cx="340" cy="320" r="68" fill="#3b82f6" fill-opacity="0.25"/>
  <line x1="386" y1="370" x2="424" y2="412" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
</svg>
