name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.versioning.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Set version
      id: versioning
      run: |
        VERSION=$(date +'%Y.%m.%d.%H%M')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install MAUI Android Workload
      run: dotnet workload install maui-android

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Web (Windows)
      run: |
        dotnet publish src/FileIndexer.Web -c Release -r win-x64 --self-contained -o ./publish/web-win
        cd ./publish/web-win && zip -r ../../FileIndexer-Web-Windows.zip . && cd ../..

    - name: Publish Web (Linux)
      run: |
        dotnet publish src/FileIndexer.Web -c Release -r linux-x64 --self-contained -o ./publish/web-linux
        cd ./publish/web-linux && tar -czvf ../../FileIndexer-Web-Linux.tar.gz . && cd ../..

    - name: Build MAUI (Android)
      run: |
        dotnet publish src/FileIndexer.Maui -c Release -f net10.0-android --no-restore -o ./publish/maui-android
        cp src/FileIndexer.Maui/bin/Release/net10.0-android/*-Signed.apk FileIndexer-Android.apk || cp src/FileIndexer.Maui/bin/Release/net10.0-android/*.apk FileIndexer-Android.apk

    - name: Upload Linux/Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-android-assets
        path: |
          FileIndexer-Web-Windows.zip
          FileIndexer-Web-Linux.tar.gz
          FileIndexer-Android.apk

  build-windows:
    runs-on: windows-latest
    needs: build-linux-android
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore

    - name: Build MAUI (Windows)
      run: |
        dotnet publish src/FileIndexer.Maui -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -p:WindowsPackageType=None -o ./publish/maui-windows -p:OnlyWindows=true
        Compress-Archive -Path ./publish/maui-windows/* -DestinationPath FileIndexer-MAUI-Windows.zip

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets
        path: FileIndexer-MAUI-Windows.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux-android, build-windows]
    permissions:
      contents: write
    
    steps:
    - name: Download Linux/Android Artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-android-assets
        path: ./assets

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-assets
        path: ./assets

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.build-linux-android.outputs.version }}
        name: Release v${{ needs.build-linux-android.outputs.version }}
        draft: false
        prerelease: false
        files: ./assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
